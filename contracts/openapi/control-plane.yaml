          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security: &a4
        - EnvironmentKey: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input: {}
                deploymentId: *a1
              required:
                - input
              additionalProperties: false
      x-minimum-capability: V1
  /workflows:
    get:
      operationId: listworkflows
      summary: listworkflows
      parameters:
        - name: environment
          in: query
          required: true
          schema: *a1
        - name: cursor
          in: query
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      x-required-capability: workflows:read
      x-implemented: false
      responses:
        "200":
          description: Committed response
          content:
            application/json:
              schema:
                type: object
