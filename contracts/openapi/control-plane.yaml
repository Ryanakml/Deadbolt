components:
  responses:
    ErrorResponse:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RunStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - WAITING
        - PAUSING
        - PAUSED
        - CANCELLING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    StepStatus:
      type: string
      enum:
        - BLOCKED
        - READY
        - RUNNING
        - WAITING
        - SUCCEEDED
        - FAILED
        - CANCELLED
        - SKIPPED
    AttemptStatus:
      type: string
      enum:
        - CLAIMED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - TIMED_OUT
        - LOST
        - CANCELLED
    RecoveryMode:
      type: string
      enum:
        - safe
        - idempotent
        - reconcile
    ErrorEnvelope:
      type: object
      properties:
        code: *a1
        message: *a1
        requestId: *a1
        details:
          type: object
        retryable:
          type: boolean
      required:
        - code
        - message
        - requestId
        - details
        - retryable
      additionalProperties: false
    CreateRunRequest:
      type: object
      properties:
        environment: *a1
        input: {}
        deploymentId: *a1
      required:
        - environment
        - input
      additionalProperties: false
    PauseRunRequest:
      $ref: "#/components/schemas/RevisionCommand"
    ResolveReconciliationRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - confirm_succeeded
            - confirm_not_executed_retry
            - fail_run
        evidence:
          type: string
        result: {}
        expectedRevision:
          type: integer
      required:
        - action
        - evidence
        - expectedRevision
      allOf:
        - if:
            properties:
              action:
                const: confirm_succeeded
          then:
            required:
              - result
    Run:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        environmentId:
          type: string
        workflowName:
          type: string
        deploymentId:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        reasonCode:
          type: string
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
      required:
        - id
        - workflowName
        - deploymentId
        - status
        - revision
        - createdAt
    RunSnapshot:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            lastEventSequence: *a3
            steps:
              type: array
              items:
                $ref: "#/components/schemas/RunStep"
            output: {}
            error:
              $ref: "#/components/schemas/ErrorEnvelope"
          required:
            - lastEventSequence
            - steps
    RunStep:
      type: object
      properties:
        id:
          type: string
        nodeId:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        currentEpoch:
          type: integer
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/TaskAttempt"
      required:
        - id
        - nodeId
        - status
    TaskAttempt:
      type: object
      properties:
        id:
          type: string
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/AttemptStatus"
        workerSessionId:
          type: string
        ownershipEpoch:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - attemptNumber
        - status
    RunEvent:
      type: object
      properties:
        id: *a1
        runId: *a1
        sequence: *a3
        schemaVersion:
          const: 1
        type:
          type: string
          pattern: ^[a-z]+\.[a-z_]+$
        requestId: *a1
        payload:
          type: object
        committedAt:
          type: string
          format: date-time
      required:
        - id
        - runId
        - sequence
        - schemaVersion
        - type
        - payload
        - committedAt
      additionalProperties: false
    RunEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        hasMore:
          type: boolean
        nextCursor:
          type: integer
      required:
        - events
        - hasMore
    RegisterDeploymentRequest:
      $ref: ../manifest/deployment.schema.json
    Deployment:
      type: object
      properties:
        id:
          type: string
        manifestHash:
          type: string
        bundleDigest:
          type: string
        status:
          type: string
          enum:
            - REGISTERED
            - AVAILABLE
            - ACTIVE
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - manifestHash
        - bundleDigest
        - status
    ApprovalStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - EXPIRED
        - CANCELLED
    TimerStatus:
      type: string
      enum:
        - PENDING
        - FIRED
        - CANCELLED
    WorkerStatus:
      type: string
      enum:
        - ONLINE
        - DRAINING
        - OFFLINE
        - REVOKED
    RevisionCommand:
      type: object
      properties:
        expectedRevision: *a3
      required:
        - expectedRevision
      additionalProperties: false
    Workflow:
      type: object
      properties:
        name: *a1
        activeDeploymentId:
          type:
            - string
            - "null"
        revision: *a3
      required:
        - name
        - activeDeploymentId
        - revision
      additionalProperties: false
    Worker:
      type: object
      properties:
        id: *a1
        environmentId: *a1
        pool: *a1
        status:
          $ref: "#/components/schemas/WorkerStatus"
        deploymentDigests:
          type: array
          items: *a1
      required:
        - id
        - environmentId
        - pool
        - status
        - deploymentDigests
      additionalProperties: false
    ReconciliationDecision:
      $ref: "#/components/schemas/ResolveReconciliationRequest"
    Schedule:
      type: object
      properties:
        id: *a1
        workflow: *a1
        environment: *a1
        cron: *a1
        timezone:
          type: string
          default: UTC
        deploymentId: *a1
        overlapPolicy:
          const: skip-overlap
        misfirePolicy:
          const: coalesce-one
        paused:
          type: boolean
        revision: *a3
      required:
        - workflow
        - environment
        - cron
        - timezone
        - overlapPolicy
        - misfirePolicy
        - paused
      additionalProperties: false
    WebhookEndpoint:
      type: object
      properties:
        id: *a1
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        revision: *a3
        eventTypes:
          type: array
          items:
            enum:
              - run.succeeded
              - run.failed
              - run.cancelled
              - approval.requested
      required:
        - url
        - enabled
        - eventTypes
      additionalProperties: false
  securitySchemes:
    EnvironmentKey:
      type: http
      scheme: bearer
      description:
        Environment-scoped API key. Scope is authoritative; mismatches are
        rejected.
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-runtime_session
      description:
        Go BFF session; cookie mutations also require CSRF token and Origin
        validation.
security: *a4
