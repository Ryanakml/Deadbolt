name: Foundation contracts
on:
  pull_request:
  push:
    branches: [main, "feature/m0-foundation-contracts"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:config
      - run: pnpm lint
      - run: test -z "$(gofmt -l contracts internal tests)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test -race ./...
      - run: go vet ./...
      - run: pnpm check:contracts
      - run: pnpm check:parity
      - run: node scripts/check-candidates.mjs
      - run: go mod verify
      - run: pnpm audit
      - run: node scripts/install-tools.mjs sqlc goose gitleaks govulncheck
      - run: bin/sqlc version
      - run: bin/goose -version
      - run: bin/govulncheck ./...
      - name: Verify control plane Dockerfile builds
        run: |
          docker build -f deploy/Dockerfile.control-plane --build-arg COMMIT_SHA="${{ github.sha }}" -t deadbolt-control-plane:test .
      - name: Validate Docker Compose and Profiles
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile core config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile telemetry config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile fault config --quiet
          DEADBOLT_DB_SYSTEM_PASSWORD=mock DATABASE_URL=postgres://runtime:mock@localhost:5432/mock MIGRATOR_DATABASE_URL=postgres://migrator:mock@localhost:5432/mock DEADBOLT_IMAGE=ghcr.io/ryanakml/deadbolt/control-plane@sha256:1111222233334444555566667777888899990000aaaaabbbbbcccccdddddeeeee DEADBOLT_OIDC_ISSUER=https://i DEADBOLT_OIDC_CLIENT_ID=id DEADBOLT_OIDC_CLIENT_SECRET=s DEADBOLT_STAGING_DOMAIN=staging.deadbolt.cloud docker compose -f deploy/compose/docker-compose.staging.yml --profile slot-blue --profile slot-green config --quiet
          DRY_RUN=true ./scripts/reload-caddy.sh
          DRY_RUN=true ./scripts/check-backup-readiness.sh
          DRY_RUN=true ./scripts/deploy-staging.sh
          DRY_RUN=true ./scripts/retention.sh
      - name: Clean-clone Local Compose Boot Smoke
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile core up -d
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/livez >/dev/null 2>&1; then
              echo "Local compose control plane is alive!"
              break
            fi
            sleep 2
          done
          # Test stop and start preserves volume persistence
          docker compose -f deploy/compose/docker-compose.yml --profile core stop
          docker compose -f deploy/compose/docker-compose.yml --profile core start
          curl -fs http://127.0.0.1:8080/livez >/dev/null 2>&1 || exit 1
          # Explicit clean teardown
          docker compose -f deploy/compose/docker-compose.yml --profile core down -v
      - name: Scan tracked source and history without printing secrets
        run: |
          bin/gitleaks git --redact --no-banner --log-opts="--all"
