name: Foundation contracts
on:
  pull_request:
  push:
    branches: [main, "feature/m0-foundation-contracts"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deadbolt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/deadbolt_test?sslmode=disable
      DATABASE_URL: postgres://postgres@localhost:5432/deadbolt_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:config
      - run: pnpm lint
      - run: test -z "$(gofmt -l contracts internal tests)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test -race ./...
      - run: go vet ./...
      - run: pnpm check:contracts
      - run: pnpm check:parity
      - run: node scripts/check-candidates.mjs
      - run: go mod verify
      - run: pnpm audit
      - run: node scripts/install-tools.mjs sqlc goose gitleaks govulncheck
      - run: bin/sqlc version
      - run: bin/goose -version
      - run: bin/govulncheck ./...
      - name: Scan tracked source and history without printing secrets
        run: |
          bin/gitleaks git --redact --no-banner --log-opts="--all"
