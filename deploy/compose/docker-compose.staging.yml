name: deadbolt-staging

networks:
  deadbolt_staging_net:
    driver: bridge

volumes:
  deadbolt_staging_postgres_data:
  deadbolt_staging_nats_data:

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: deadbolt-staging-postgres
    restart: unless-stopped
    networks:
      - deadbolt_staging_net
    environment:
      POSTGRES_DB: deadbolt_staging
      POSTGRES_USER: deadbolt_system
      POSTGRES_PASSWORD: ${DEADBOLT_DB_SYSTEM_PASSWORD:?Required system db password}
    # Security constraint: No public host port exposure for PostgreSQL
    expose:
      - "5432"
    volumes:
      - deadbolt_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadbolt_system -d deadbolt_staging"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  nats:
    image: nats:2@sha256:c50b0a773c6c8d033cad54f7c53cb97fd6e09b3bfc1accda7cd4fa94e19e9ed9
    container_name: deadbolt-staging-nats
    restart: unless-stopped
    networks:
      - deadbolt_staging_net
    command: ["-js", "-sd", "/data"]
    # Security constraint: No public host port exposure for NATS
    expose:
      - "4222"
    volumes:
      - deadbolt_staging_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  control-plane:
    image: ${DEADBOLT_IMAGE:-ghcr.io/ryanakml/deadbolt/control-plane}:${IMAGE_TAG:-latest}
    container_name: deadbolt-staging-control-plane
    restart: unless-stopped
    networks:
      - deadbolt_staging_net
    environment:
      RUNTIME_MODE: hosted
      DEV_AUTH_ENABLED: "false"
      COOKIE_SECURE: "true"
      LISTEN_ADDR: "0.0.0.0:8080"
      DATABASE_URL: ${DATABASE_URL:?Required database connection string}
      NATS_URL: nats://nats:4222
      DEADBOLT_OIDC_ISSUER: ${DEADBOLT_OIDC_ISSUER:?Required OIDC issuer}
      DEADBOLT_OIDC_CLIENT_ID: ${DEADBOLT_OIDC_CLIENT_ID:?Required OIDC client id}
      DEADBOLT_OIDC_CLIENT_SECRET: ${DEADBOLT_OIDC_CLIENT_SECRET:?Required OIDC client secret}
      DEADBOLT_OIDC_REDIRECT_URL: ${DEADBOLT_OIDC_REDIRECT_URL:-https://${DEADBOLT_STAGING_DOMAIN}/api/auth/callback}
      DEADBOLT_ALLOWED_ORIGINS: ${DEADBOLT_ALLOWED_ORIGINS:-https://${DEADBOLT_STAGING_DOMAIN}}
    # Bound strictly to loopback on host port 8088 for existing Caddy edge reverse proxy
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/livez"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
