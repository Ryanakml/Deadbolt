<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Deadbolt architecture</title>
<desc id="desc">Applications and the dashboard connect to the Go control plane. PostgreSQL holds durable state. A transactional outbox feeds NATS wake-up hints back to the control plane. A customer-hosted Go worker connects outbound over HTTPS and runs Node.js tasks that call external services.</desc>
