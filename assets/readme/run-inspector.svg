<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
<title id="title">Deadbolt Run Inspector — interface concept</title>
<desc id="desc">A dark workflow dashboard showing a successful search, an analyze task recovering on worker B, and a report waiting on its dependency. Event history and attempt details explain worker lease expiry and reassignment. This is a static design concept.</desc>
